name: Gate

on:
  push:
    branches: [main, ci/diag-skeleton]
  pull_request:

permissions:
  contents: read

concurrency:
  group: gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-node@v4.4.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npx playwright test
      - run: npx playwright test tests/e2e/skeleton.spec.ts tests/e2e/hovercard-drag.spec.ts --repeat-each 8
